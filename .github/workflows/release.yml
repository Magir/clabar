name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release app bundle
        env:
          SPARKLE_PUB_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # The appcast lives as a release asset — the /latest/ URL always
          # serves the newest release. (GitHub Pages proved unreliable here:
          # deployments queued 10-25 min against the action's hard 10-min cap.)
          if [[ -n "${SPARKLE_PUB_KEY:-}" ]]; then
            make app \
              APP_VERSION="${GITHUB_REF_NAME#v}" \
              SU_FEED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" \
              SPARKLE_PUB_KEY="${SPARKLE_PUB_KEY}"
          else
            echo "::warning::SPARKLE_PUBLIC_KEY variable not set — building without auto-update support."
            make app APP_VERSION="${GITHUB_REF_NAME#v}"
          fi

      - name: Launch smoke test
        run: |
          set -euo pipefail
          CLABAR_NO_AUTOINSTALL=1 CLABAR_DATA_DIR="$RUNNER_TEMP/clabar-smoke" \
            ./build/Clabar.app/Contents/MacOS/Clabar &
          APP_PID=$!
          sleep 6
          curl -sf -m 3 http://127.0.0.1:8737/ping
          kill "$APP_PID"

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/Clabar.app Clabar.zip

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::warning::SPARKLE_PRIVATE_KEY secret not set — no appcast; auto-updates disabled for this release."
            exit 0
          fi
          mkdir -p dist/archives
          cp Clabar.zip dist/archives/Clabar.zip
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              dist/archives \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --maximum-deltas 0 \
              -o appcast.xml

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq '.body' > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Clabar.zip
            appcast.xml
          body_path: release-notes.md
