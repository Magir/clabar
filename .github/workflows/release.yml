name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    outputs:
      appcast: ${{ steps.appcast.outputs.generated }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build release app bundle
        env:
          SPARKLE_PUB_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${SPARKLE_PUB_KEY:-}" ]]; then
            owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            repo="${GITHUB_REPOSITORY#*/}"
            make app \
              APP_VERSION="${GITHUB_REF_NAME#v}" \
              SU_FEED_URL="https://${owner}.github.io/${repo}/appcast.xml" \
              SPARKLE_PUB_KEY="${SPARKLE_PUB_KEY}"
          else
            echo "::warning::SPARKLE_PUBLIC_KEY variable not set — building without auto-update support."
            make app APP_VERSION="${GITHUB_REF_NAME#v}"
          fi

      - name: Launch smoke test
        run: |
          set -euo pipefail
          CLABAR_NO_AUTOINSTALL=1 CLABAR_DATA_DIR="$RUNNER_TEMP/clabar-smoke" \
            ./build/Clabar.app/Contents/MacOS/Clabar &
          APP_PID=$!
          sleep 6
          curl -sf -m 3 http://127.0.0.1:8737/ping
          kill "$APP_PID"

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/Clabar.app Clabar.zip

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq '.body' > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Clabar.zip
          body_path: release-notes.md

      - name: Generate Sparkle appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::warning::SPARKLE_PRIVATE_KEY secret not set — skipping appcast; auto-updates disabled for this release."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p dist/archives dist/site
          cp Clabar.zip dist/archives/Clabar.zip
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              dist/archives \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --maximum-deltas 0 \
              -o dist/site/appcast.xml
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload appcast for GitHub Pages
        if: steps.appcast.outputs.generated == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy_appcast:
    needs: release
    if: needs.release.outputs.appcast == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Note: Pages deployments have a server-side 10-minute cap — raising the
      # action's timeout does nothing. If deployments sit in deployment_queued
      # forever, the Pages site is wedged: recreate it
      # (DELETE /repos/{o}/{r}/pages, POST with build_type=workflow).
      - name: Deploy appcast
        id: deployment
        uses: actions/deploy-pages@v4
